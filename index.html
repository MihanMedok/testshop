<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121412">
<title>Пиксель — магазин цифровых товаров</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#121412;--panel:#1b1e1a;--line:#373d33;--ink:#f3f5ef;--muted:#afb8aa;--lime:#d1ff77;font:16px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:4px}button:disabled{opacity:.5;cursor:default}
main{max-width:940px;margin:auto;padding:24px 20px 48px}.top,.section-head,.item-bottom,.order-total,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:1.32rem;letter-spacing:-.04em}.brand span{color:var(--lime)}.button,.chip,.icon{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 14px}.primary{background:var(--lime);border-color:var(--lime);color:#1a2410;font-weight:750}.hero{margin:26px 0 32px;padding:clamp(22px,6vw,54px);border:1px solid #465334;border-radius:24px;background:radial-gradient(ellipse at 100% 0%,#3b5125,transparent 62%),#20291b}.tag{font-size:.8rem;color:var(--lime);font-weight:750}.hero h1{font-size:clamp(2rem,7vw,4.3rem);line-height:1.02;letter-spacing:-.065em;margin:12px 0}.hero p,.muted{color:var(--muted)}.hero p{margin-bottom:0}.section-head h2{margin:0;font-size:1.5rem}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip[aria-pressed=true]{color:var(--lime);border-color:#819b53;background:#26321d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.card{display:flex;flex-direction:column;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#303c24;color:var(--lime);font-size:1.4rem}.card[data-kind=sub] .mark{background:#322a49;color:#d9c5ff}.card[data-kind=account] .mark{background:#243a41;color:#a7e7f4}.card h3{margin:14px 0 4px}.card p{margin:0 0 18px;color:var(--muted);font-size:.9rem;flex:1}.item-bottom strong{white-space:nowrap}.item-bottom button{font-size:.88rem}dialog{width:min(480px,calc(100% - 24px));max-height:85dvh;padding:20px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px}dialog::backdrop{background:#000a}.row{padding:12px 0;border-bottom:1px solid var(--line)}.quantity{display:flex;align-items:center;gap:8px}.icon{min-width:38px;padding:5px 9px}.order-total{margin:18px 0}.checkout{width:100%}.status{min-height:1.5em;color:var(--lime);margin:16px 0 0}#receipt{margin-top:14px}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand"><span>◆</span> Пиксель</div><button class="button" id="open-cart" type="button">Корзина · 0</button></header>
<section class="hero" aria-labelledby="hero-title">
  <div class="tag">Демо-магазин</div>
  <h1 id="hero-title">Цифровые товары</h1>
  <p>Игровая валюта, подписки и доступы. Здесь можно оформить тестовый заказ без оплаты.</p>
</section>
<section aria-labelledby="catalog-title">
  <div class="section-head"><h2 id="catalog-title">Каталог</h2><span class="muted" id="result-count"></span></div>
  <div class="filters" aria-label="Категории" id="filters"></div>
  <div class="grid" id="catalog"></div>
  <p class="status" id="status" role="status"></p>
</section>
</main>
<dialog id="cart-dialog" aria-labelledby="cart-title">
  <div class="section-head"><h2 id="cart-title">Корзина</h2><form method="dialog"><button class="icon" aria-label="Закрыть корзину">×</button></form></div>
  <div id="cart-items"></div>
  <div class="order-total"><span>Итого</span><strong id="total"></strong></div>
  <button id="checkout" class="button primary checkout" type="button">Оформить тестовый заказ</button>
  <div class="status" id="receipt" role="status"></div>
</dialog>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const telegram = window.Telegram?.WebApp;
  if (telegram?.initData) {
    telegram.ready();
    telegram.expand();
  }

  const categories = [
    { id: 'all', title: 'Все товары' },
    { id: 'coins', title: 'Валюта', mark: '◈' },
    { id: 'sub', title: 'Подписки', mark: '✦' },
    { id: 'account', title: 'Доступы', mark: '▣' }
  ];
  const products = [
    { id: 'coins500', kind: 'coins', title: '500 кристаллов', detail: 'Малый набор игровой валюты', price: 249 },
    { id: 'coins1200', kind: 'coins', title: '1 200 кристаллов', detail: 'Большой набор игровой валюты', price: 499 },
    { id: 'music', kind: 'sub', title: 'Волна Плюс', detail: 'Музыкальная подписка на месяц', price: 299 },
    { id: 'cloud', kind: 'sub', title: 'Облако 100 ГБ', detail: 'Место для файлов на месяц', price: 199 },
    { id: 'studio', kind: 'account', title: 'Студия Pro', detail: 'Тестовый аккаунт фоторедактора на 7 дней', price: 349 },
    { id: 'arena', kind: 'account', title: 'Арена Beta', detail: 'Тестовый доступ к закрытой версии игры', price: 159 }
  ];

  const get = (id) => document.getElementById(id);
  const money = (amount) => new Intl.NumberFormat('ru-RU', {
    style: 'currency', currency: 'RUB', maximumFractionDigits: 0
  }).format(amount);
  const storageKey = 'pixel-demo-cart-v1';
  const dialog = get('cart-dialog');
  let category = 'all';
  let cart = {};

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    for (const product of products) {
      const count = saved?.[product.id];
      if (Number.isInteger(count) && count > 0 && count <= 99) cart[product.id] = count;
    }
  } catch {
    // Корзина продолжает работать в памяти, если хранилище недоступно.
  }

  function renderCatalog() {
    const visible = products.filter((product) => category === 'all' || product.kind === category);
    get('result-count').textContent = visible.length + ' из ' + products.length;
    get('catalog').innerHTML = visible.map((product) => {
      const group = categories.find((item) => item.id === product.kind);
      return '<article class="card" data-kind="' + product.kind + '">'
        + '<div class="mark" aria-hidden="true">' + group.mark + '</div>'
        + '<h3>' + product.title + '</h3><p>' + product.detail + '</p>'
        + '<div class="item-bottom"><strong>' + money(product.price) + '</strong>'
        + '<button class="button primary" type="button" data-add="' + product.id
        + '" aria-label="В корзину: ' + product.title + '">В корзину</button></div></article>';
    }).join('');
  }

  function renderCart() {
    const items = products.filter((product) => cart[product.id]);
    const count = items.reduce((sum, product) => sum + cart[product.id], 0);
    const total = items.reduce((sum, product) => sum + product.price * cart[product.id], 0);
    get('open-cart').textContent = 'Корзина · ' + count;
    get('total').textContent = money(total);
    get('checkout').disabled = count === 0;
    get('cart-items').innerHTML = items.map((product) =>
      '<div class="row"><div><strong>' + product.title + '</strong><br>'
      + '<span class="muted">' + money(product.price) + ' за шт.</span></div>'
      + '<div class="quantity"><button class="icon" data-minus="' + product.id
      + '" aria-label="Уменьшить количество: ' + product.title + '">−</button>'
      + '<span>' + cart[product.id] + '</span><button class="icon" data-plus="' + product.id
      + '" aria-label="Увеличить количество: ' + product.title + '">+</button></div></div>'
    ).join('') || '<p class="muted">Корзина пока пуста.</p>';
  }

  function saveCart() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(cart));
    } catch {
      // При следующем открытии корзина будет пустой.
    }
    renderCart();
  }

  function changeQuantity(id, delta) {
    const next = (cart[id] || 0) + delta;
    if (next > 99) return false;
    if (next > 0) cart[id] = next;
    else delete cart[id];
    get('receipt').textContent = '';
    saveCart();
    return true;
  }

  get('filters').innerHTML = categories.map((item) =>
    '<button class="chip" type="button" data-filter="' + item.id
    + '" aria-pressed="' + (item.id === category) + '">' + item.title + '</button>'
  ).join('');
  get('filters').addEventListener('click', (event) => {
    const button = event.target.closest('[data-filter]');
    if (!button) return;
    category = button.dataset.filter;
    for (const chip of get('filters').children) {
      chip.setAttribute('aria-pressed', String(chip === button));
    }
    renderCatalog();
  });
  get('catalog').addEventListener('click', (event) => {
    const button = event.target.closest('[data-add]');
    if (!button) return;
    const product = products.find((item) => item.id === button.dataset.add);
    get('status').textContent = changeQuantity(product.id, 1)
      ? product.title + ' — в корзине ' + cart[product.id] + ' шт.'
      : 'Лимит для этого товара — 99 шт.';
  });
  get('open-cart').addEventListener('click', () => {
    dialog.showModal();
  });
  get('cart-items').addEventListener('click', (event) => {
    const button = event.target.closest('[data-minus], [data-plus]');
    if (!button) return;
    const id = button.dataset.minus || button.dataset.plus;
    if (!changeQuantity(id, button.dataset.minus ? -1 : 1)) {
      get('receipt').textContent = 'Лимит для этого товара — 99 шт.';
      return;
    }
    const attribute = button.dataset.minus ? 'minus' : 'plus';
    const replacement = get('cart-items').querySelector('[data-' + attribute + '="' + id + '"]');
    (replacement || dialog.querySelector('form button')).focus();
  });
  get('checkout').addEventListener('click', () => {
    if (get('checkout').disabled) return;
    const total = get('total').textContent;
    cart = {};
    saveCart();
    get('status').textContent = '';
    get('receipt').textContent = 'Тестовый заказ оформлен на ' + total + '. Оплата не списана.';
    dialog.querySelector('form button').focus();
  });

  renderCatalog();
  renderCart();
});
</script>
</body>
</html>
